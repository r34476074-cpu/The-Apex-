<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Apex - Branching Evolutions</title>
    <style>
        body {
            margin: 0;
            background-color: #08080c;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 {
            margin: 2px 0;
            font-size: 2.2rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #00ffcc;
            text-shadow: 0 0 10px #00ffcc;
        }
        #ui-bar {
            display: flex;
            gap: 20px;
            font-size: 1.1rem;
            margin-bottom: 8px;
            background: #12121c;
            padding: 8px 20px;
            border-radius: 5px;
            border: 1px solid #333;
        }
        #class-display {
            font-weight: bold;
            color: #00ffcc;
            text-shadow: 0 0 8px currentColor;
        }
        #gameCanvas {
            background-color: #0e0e14;
            border: 4px solid #2b2b3d;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.1);
            border-radius: 6px;
        }
        #upgrade-menu {
            margin-top: 8px;
            display: flex;
            gap: 12px;
            min-height: 35px;
        }
        .upgrade-btn {
            background: #1a1a26;
            border: 1px solid #00ffcc;
            color: #00ffcc;
            padding: 5px 12px;
            border-radius: 3px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            animation: pulse 1.5s infinite;
        }
        .upgrade-btn:hover {
            background: #00ffcc;
            color: #000;
        }
        .hint {
            margin-top: 5px;
            font-size: 0.85rem;
            color: #666;
        }
        @keyframes pulse {
            0% { opacity: 0.8; }
            50% { opacity: 1; }
            100% { opacity: 0.8; }
        }
    </style>
</head>
<body>

    <h1>THE APEX</h1>
    
    <div id="ui-bar">
        <div>HP: <span id="hp">100</span>/<span id="max-hp">100</span></div>
        <div>Level: <span id="level">1</span></div>
        <div>Class: <span id="class-display">Basic Apex</span></div>
        <div>XP: <span id="xp">0</span>/<span id="xp-needed">15</span></div>
        <div>Score: <span id="score">0</span></div>
    </div>
    
    <canvas id="gameCanvas" width="900" height="520"></canvas>
    
    <div id="upgrade-menu"></div>

    <div class="hint">Move: <b>WASD / Arrows</b> | Shoot: <b>SPACE</b> | Restart: <b>ENTER</b> on Game Over</div>
      <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // DOM Elements
        const hpEl = document.getElementById("hp");
        const maxHpEl = document.getElementById("max-hp");
        const levelEl = document.getElementById("level");
        const classEl = document.getElementById("class-display");
        const xpEl = document.getElementById("xp");
        const xpNeededEl = document.getElementById("xp-needed");
        const scoreEl = document.getElementById("score");
        const upgradeMenu = document.getElementById("upgrade-menu");

        // Game Trackers
        let score = 0;
        let gameOver = false;
        let lastShotTime = 0;

        // Soft Progression System
        let level = 1;
        let xp = 0;
        let xpNeeded = 15;
        let pendingEvolution = false;

        // Branching Tree Properties
        let playerClass = "Basic Apex"; 
        let bulletPattern = "single"; 

        const player = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            size: 30,
            speed: 4.5,
            damage: 12,
            fireRate: 350, 
            maxHp: 100,
            hp: 100
        };

        let enemies = [];
        let bullets = [];

        const keys = {
            w: false, a: false, s: false, d: false, Space: false,
            ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false
        };

        // Key Listeners
        window.addEventListener("keydown", (e) => {
            if (e.code === "Space") keys.Space = true;
            else if (e.key in keys) keys[e.key] = true;
            else if (e.code === "ArrowUp") keys.ArrowUp = true;
            else if (e.code === "ArrowDown") keys.ArrowDown = true;
            else if (e.code === "ArrowLeft") keys.ArrowLeft = true;
            else if (e.code === "ArrowRight") keys.ArrowRight = true;

            if (e.code === "Enter" && gameOver) restartGame();
        });

        window.addEventListener("keyup", (e) => {
            if (e.code === "Space") keys.Space = false;
            else if (e.key in keys) keys[e.key] = false;
            else if (e.code === "ArrowUp") keys.ArrowUp = false;
            else if (e.code === "ArrowDown") keys.ArrowDown = false;
            else if (e.code === "ArrowLeft") keys.ArrowLeft = false;
            else if (e.code === "ArrowRight") keys.ArrowRight = false;
        });

        function collectXP(amount) {
            xp += amount;
            if (xp >= xpNeeded) {
                xp -= xpNeeded;
                level++;
                xpNeeded += 5; // Gentle upgrade scaling

                // Check for Branching Choices Threshold
                if (level === 10 || level === 25) {
                    pendingEvolution = true;
                }
            }
            updateUI();
        }

        // Branch System Menu Choices generator
        function updateUI() {
            hpEl.innerText = Math.max(0, Math.floor(player.hp));
            maxHpEl.innerText = player.maxHp;
            levelEl.innerText = level;
            classEl.innerText = playerClass;
            xpEl.innerText = xp;
            xpNeededEl.innerText = xpNeeded;
            scoreEl.innerText = score;

            // Render buttons dynamically if an upgrade choice is ready
            upgradeMenu.innerHTML = "";
            if (pendingEvolution) {
                if (level >= 10 && level < 25 && playerClass === "Basic Apex") {
                    createUpgradeButton("1: Twin Blaster", () => chooseBranch("Twin Blaster", "twin"));
                    createUpgradeButton("2: Sniper", () => chooseBranch("Sniper", "sniper"));
                } 
                else if (level >= 25) {
                    if (playerClass === "Twin Blaster") {
                        createUpgradeButton("1: Triple Spread", () => chooseBranch("Triple Spread", "triple"));
                        createUpgradeButton("2: Flank Guard", () => chooseBranch("Flank Guard", "flank"));
                    } else if (playerClass === "Sniper") {
                        createUpgradeButton("1: Assassin", () => chooseBranch("Assassin", "assassin"));
                        createUpgradeButton("2: Hunter", () => chooseBranch("Hunter", "hunter"));
                    }
                }
            }
        }

        function createUpgradeButton(text, callback) {
            const btn = document.createElement("button");
            btn.className = "upgrade-btn";
            btn.innerText = text;
            btn.onclick = () => {
                callback();
                updateUI();
            };
            upgradeMenu.appendChild(btn);
        }

        function chooseBranch(className, patternName) {
            playerClass = className;
            bulletPattern = patternName;
            pendingEvolution = false;

            // Apply Class specific modifiers
            if (className === "Twin Blaster") {
                player.fireRate = 280;
                player.damage = 10; 
            } else if (className === "Sniper") {
                player.fireRate = 550;
                player.damage = 35;
                player.speed = 4.0;
            } else if (className === "Triple Spread") {
                player.fireRate = 260;
                player.damage = 12;
            } else if (className === "Flank Guard") {
                player.fireRate = 200;
                player.damage = 11;
                player.maxHp = 140;
                player.hp += 40;
            } else if (className === "Assassin") {
                player.fireRate = 650;
                player.damage = 70;
            } else if (className === "Hunter") {
                player.fireRate = 400;
                player.damage = 25;
            }
        }
           function spawnEnemyBot() {
            if (gameOver) return;
            let x, y;
            if (Math.random() < 0.5) {
                x = Math.random() < 0.5 ? -40 : canvas.width + 40;
                y = Math.random() * canvas.height;
            } else {
                x = Math.random() * canvas.width;
                y = Math.random() < 0.5 ? -40 : canvas.height + 40;
            }
            const scalingHp = 15 + (level * 3.5); 
            enemies.push({
                x: x, y: y, size: 22,
                speed: 1.2 + Math.min(1.8, level * 0.02),
                hp: scalingHp, maxHp: scalingHp
            });
        }

        function processFiredProjectiles() {
            const now = Date.now();
            if (keys.Space && now - lastShotTime >= player.fireRate) {
                // Determine pattern mechanics based on branching choice
                if (bulletPattern === "single") {
                    fireBullet(0, -9, 0);
                } 
                else if (bulletPattern === "twin") {
                    fireBullet(-10, -9, 0);
                    fireBullet(10, -9, 0);
                } 
                else if (bulletPattern === "sniper") {
                    fireBullet(0, -14, 0, 10); // Very fast speed, custom bullet height
                } 
                else if (bulletPattern === "triple") {
                    fireBullet(0, -9, 0);
                    fireBullet(-4, -9, -2);
                    fireBullet(4, -9, 2);
                } 
                else if (bulletPattern === "flank") {
                    fireBullet(0, -9, 0); // Forward
                    fireBullet(0, 9, 0);  // Backward
                } 
                else if (bulletPattern === "assassin") {
                    fireBullet(0, -18, 0, 14); // Ultra bullet speed and length
                } 
                else if (bulletPattern === "hunter") {
                    fireBullet(0, -11, 0);
                    // Second rapid bullet delayed slightly
                    setTimeout(() => { if(!gameOver) fireBullet(0, -11, 0); }, 100);
                }
                lastShotTime = now;
            }
        }

        function fireBullet(offsetX, speedY, speedX = 0, customHeight = 14) {
            bullets.push({
                x: player.x + offsetX - 3,
                y: player.y - player.size / 2,
                width: 6, height: customHeight,
                speedY: speedY, speedX: speedX
            });
        }

        function runGameTick() {
            if (gameOver) return;

            let moveX = 0, moveY = 0;
            if (keys.w || keys.ArrowUp) moveY -= player.speed;
            if (keys.s || keys.ArrowDown) moveY += player.speed;
            if (keys.a || keys.ArrowLeft) moveX -= player.speed;
            if (keys.d || keys.ArrowRight) moveX += player.speed;

            player.x += moveX; player.y += moveY;

            const halfSize = player.size / 2;
            if (player.x < halfSize) player.x = halfSize;
            if (player.x > canvas.width - halfSize) player.x = canvas.width - halfSize;
            if (player.y < halfSize) player.y = halfSize;
            if (player.y > canvas.height - halfSize) player.y = canvas.height - halfSize;

            processFiredProjectiles();

            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.y += b.speedY; b.x += b.speedX;
                if (b.y < -30 || b.y > canvas.height + 30 || b.x < -30 || b.x > canvas.width + 30) {
                    bullets.splice(i, 1);
                }
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                let bot = enemies[i];
                let run = player.x - (bot.x + bot.size / 2);
                let rise = player.y - (bot.y + bot.size / 2);
                let dist = Math.sqrt(run * run + rise * rise);

                if (dist > 0) {
                    bot.x += (run / dist) * bot.speed;
                    bot.y += (rise / dist) * bot.speed;
                }

                if (player.x + halfSize > bot.x && player.x - halfSize < bot.x + bot.size &&
                    player.y + halfSize > bot.y && player.y - halfSize < bot.y + bot.size) {
                    player.hp -= 0.6;
                    updateUI();
                    if (player.hp <= 0) gameOver = true;
                }

                for (let j = bullets.length - 1; j >= 0; j--) {
                    let laser = bullets[j];
                    if (laser.x < bot.x + bot.size && laser.x + laser.width > bot.x &&
                        laser.y < bot.y + bot.size && laser.y + laser.height > bot.y) {
                        bullets.splice(j, 1);
                        bot.hp -= player.damage;

                        if (bot.hp <= 0) {
                            enemies.splice(i, 1);
                            score += 15;
                            collectXP(5);
                            break;
                        }
                    }
                }
            }
        }

        function drawPlayerCharacter() {
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.shadowBlur = 18;

            // Color adjustments reflecting upgrade tier status
            if (bulletPattern === "single") { ctx.fillStyle = "#00ff66"; ctx.shadowColor = "#00ff66"; }
            else if (playerClass === "Twin Blaster" || playerClass === "Sniper") { ctx.fillStyle = "#00bfff"; ctx.shadowColor = "#00bfff"; }
            else { ctx.fillStyle = "#ff00ff"; ctx.shadowColor = "#ff00ff"; }

            ctx.beginPath();
            if (bulletPattern === "single" || bulletPattern === "sniper" || bulletPattern === "assassin") {
                // Triangle / Pointer profiles
                ctx.moveTo(0, -player.size / 2);
                ctx.lineTo(-player.size / 2, player.size / 2);
                ctx.lineTo(player.size / 2, player.size / 2);
            } else if (bulletPattern === "twin" || bulletPattern === "hunter") {
                // Diamond configuration
                ctx.moveTo(0, -player.size * 0.6);
                ctx.lineTo(player.size * 0.5, 0);
                ctx.lineTo(0, player.size * 0.6);
                ctx.lineTo(-player.size * 0.5, 0);
            } else {
                // Multi-star array for final master classes
                for (let i = 0; i < 12; i++) {
                    ctx.rotate(Math.PI / 6);
                    ctx.lineTo(0, -player.size * 0.7);
                    ctx.rotate(Math.PI / 6);
                    ctx.lineTo(0, -player.size * 0.3);
                }
            }
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        function drawScene() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            bullets.forEach(b => {
                ctx.fillStyle = "#00ffff";
                ctx.fillRect(b.x, b.y, b.width, b.height);
            });

            enemies.forEach(bot => {
                ctx.fillStyle = "#e63946";
                ctx.fillRect(bot.x, bot.y, bot.size, bot.size);

                let hpRatio = bot.hp / bot.maxHp;
                ctx.fillStyle = "#2b2b3d";
                ctx.fillRect(bot.x, bot.y - 7, bot.size, 3);
                ctx.fillStyle = "#ff3333";
                ctx.fillRect(bot.x, bot.y - 7, bot.size * hpRatio, 3);
            });

            drawPlayerCharacter();

            if (gameOver) {
                ctx.fillStyle = "rgba(4, 4, 8, 0.95)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = "#ff3333";
                ctx.font = "bold 42px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("SYSTEM TERMINATED", canvas.width / 2, canvas.height / 2 - 20);
                
                ctx.fillStyle = "#ffffff";
                ctx.font = "20px sans-serif";
                ctx.fillText(`Final Class: ${playerClass} | Level: ${level}`, canvas.width / 2, canvas.height / 2 + 25);
                ctx.fillText("Press ENTER to Respawn", canvas.width / 2, canvas.height / 2 + 70);
            }
        }

        function mainGameLoop() {
            runGameTick();
            drawScene();
            requestAnimationFrame(mainGameLoop);
        }

        function restartGame() {
            score = 0; level = 1; xp = 0; xpNeeded = 15;
            playerClass = "Basic Apex"; bulletPattern = "single";
            player.fireRate = 350; player.damage = 12; player.speed = 4.5; player.maxHp = 100; player.hp = 100;
            player.x = canvas.width / 2; player.y = canvas.height / 2;
            enemies = []; bullets = []; gameOver = false; pendingEvolution = false;
            updateUI();
        }

        setInterval(spawnEnemyBot, 850); 
        updateUI();
        mainGameLoop();
    </script>
</body>
</html>
