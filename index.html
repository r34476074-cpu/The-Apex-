<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Apex Game</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #050510; 
            color: white; 
            font-family: 'Segoe UI', sans-serif; 
            user-select: none;
        }
        #canvas { 
            display: block; 
            background: #060614; 
        }
        .hud { 
            position: absolute; 
            pointer-events: none; 
            font-weight: bold; 
        }
        #stats { 
            top: 20px; 
            left: 20px; 
            font-size: 20px; 
            display: flex; 
            gap: 25px; 
            background: rgba(10, 10, 30, 0.85); 
            padding: 12px 20px; 
            border-radius: 8px; 
            border: 1px solid rgba(0, 255, 200, 0.2);
        }
        /* START MENU SCREEN CAPTURE OVERLAY */
        #start-overlay {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(5, 5, 20, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 10;
        }
        /* TANK STYLE UPGRADE DISPLAY MENU */
        #upgrade-menu {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 10, 35, 0.95);
            border: 3px solid #ffcc00;
            border-radius: 16px;
            padding: 25px;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            z-index: 5;
            box-shadow: 0 0 30px rgba(255,204,0,0.3);
        }
        .upgrade-card {
            background: linear-gradient(135deg, #1d1d4d, #0d0d26);
            border: 2px solid #8a2be2;
            color: white;
            padding: 15px 30px;
            border-radius: 8px;
            cursor: pointer;
            width: 250px;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
            transition: transform 0.1s, border-color 0.2s;
        }
        .upgrade-card:hover { border-color: #ffcc00; transform: scale(1.03); }
        .upgrade-card:active { transform: scale(0.97); }
    </style>
</head>
<body>

    <!-- Start Cover Screen to catch and lock keyboard inputs -->
    <div id="start-overlay" onclick="startGame()">
        <h1 style="color: #00ffcc; margin: 0 0 10px 0; font-size: 42px;">THE APEX</h1>
        <p style="color: #aaa; margin: 0 0 30px 0; font-size: 18px;">Move: W, A, S, D | Shoot: Click</p>
        <button style="background: #00ffcc; border: none; padding: 15px 40px; border-radius: 8px; font-weight: bold; font-size: 18px; cursor: pointer; box-shadow: 0 0 15px rgba(0,255,200,0.4);">
            CLICK TO START GAME
        </button>
    </div>

    <!-- Tank Progression Menu -->
    <div id="upgrade-menu">
        <h2 style="color: #ffcc00; margin: 0 0 5px 0;">LEVEL UP CHOOSE UPGRADE</h2>
        <p style="color: #aaa; margin: 0 0 15px 0; font-size: 14px;">Select a system adjustment trait:</p>
        <div class="upgrade-card" onclick="selectUpgrade('hp')">➕ Max Armor Core (+20 Max HP)</div>
        <div class="upgrade-card" onclick="selectUpgrade('speed')">⚡ Thruster Acceleration (+1 Speed)</div>
        <div class="upgrade-card" onclick="selectUpgrade('size')">🔮 Blast Radius expansion (+4 Size)</div>
    </div>

    <canvas id="canvas"></canvas>

    <div id="stats" class="hud">
        <div style="color: #ff3333;">HP: ❤️<span id="txt-hp">100</span>/<span id="txt-maxhp">100</span></div>
        <div style="color: #ffcc00;">Lv: ⭐<span id="txt-lv">1</span></div>
        <div style="color: #00ffcc;">Coins: 🪙<span id="txt-coins">0</span></div>
        <div style="color: #ffffff;">Kills: ⚔️<span id="txt-kills">0</span></div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        function resize() { 
            canvas.width = window.innerWidth; 
            canvas.height = window.innerHeight; 
        }
        window.addEventListener('resize', resize);
        resize();

        // Game Configuration Settings Flags
        let isPlaying = false;
        let isUpgrading = false;
        let stats = { level: 1, coins: 0, kills: 0 };
        
        let player = { 
            x: 2000, y: 2000, speed: 5, 
            color: '#00ffcc', eyeColor: '#ffffff',
            hp: 100, maxHp: 100, damageCooldown: 0,
            animTimer: 0
        };
        
        let projectileConfig = { size: 12 }; // Modifiable via upgrades
        let keys = { w:false, a:false, s:false, d:false };
        let mouse = { x:0, y:0 };
        let projectiles = [];
        let enemies = [];

        // Direct Global Document listeners for flawless capture tracking 
        document.addEventListener('keydown', (e) => { 
            let k = e.key.toLowerCase();
            if(k in keys) {
                keys[k] = true;
                e.preventDefault(); // Stop webpage scrolling down when hitting S
            }
        });
        document.addEventListener('keyup', (e) => { 
            let k = e.key.toLowerCase();
            if(k in keys) keys[k] = false; 
        });
        document.addEventListener('mousemove', (e) => { 
            mouse.x = e.clientX; 
            mouse.y = e.clientY; 
        });

        document.addEventListener('click', (e) => {
            if(!isPlaying || isUpgrading || player.hp <= 0) return;
            // Prevent weapon registration clicks on upgrade choice cards
            if(e.target.closest('#upgrade-menu')) return;

            let screenX = canvas.width / 2;
            let screenY = canvas.height / 2;
            let angle = Math.atan2(mouse.y - screenY, mouse.x - screenX);
            projectiles.push({
                x: player.x, y: player.y,
                vx: Math.cos(angle) * 14, vy: Math.sin(angle) * 14,
                life: 50, color: player.color, size: projectileConfig.size
            });
        });

        // Overlay trigger handler
        function startGame() {
            document.getElementById('start-overlay').style.display = 'none';
            isPlaying = true;
            window.focus(); // Force full browser execution context capture!
        }

        // Tank Choice Menu Handlers
        function selectUpgrade(type) {
            if(type === 'hp') {
                player.maxHp += 20;
                player.hp = player.maxHp; // Heal to full capacity
            } else if(type === 'speed') {
                player.speed += 1.2;
            } else if(type === 'size') {
                projectileConfig.size += 6;
            }
            
            isUpgrading = false;
            document.getElementById('upgrade-menu').style.display = 'none';
            updateHUD();
        }

        function spawnEnemy() {
            let mult = 1 + (stats.level * 0.15);
            let angle = Math.random() * Math.PI * 2;
            let dist = 500 + Math.random() * 200;
            enemies.push({
                x: player.x + Math.cos(angle) * dist,
                y: player.y + Math.sin(angle) * dist,
                hp: 20 * mult,
                speed: 1.5 + (stats.level * 0.2),
                size: 24 * mult,
                trail: []
            });
        }
        for(let i=0; i<8; i++) spawnEnemy();

        function updateHUD() {
            document.getElementById('txt-hp').innerText = player.hp;
            document.getElementById('txt-maxhp').innerText = player.maxHp;
            document.getElementById('txt-lv').innerText = stats.level;
            document.getElementById('txt-coins').innerText = stats.coins;
            document.getElementById('txt-kills').innerText = stats.kills;
        }

        function drawAnimeCharacter(cx, cy, size, color, eyeColor, isBot, animVal) {
            ctx.save();
            let auraGrad = ctx.createRadialGradient(cx, cy, size * 0.4, cx, cy, size * 1.5);
            if(!isBot) {
                auraGrad.addColorStop(0, 'rgba(0, 255, 200, 0.6)');
                auraGrad.addColorStop(0.5, 'rgba(0, 100, 255, 0.2)');
                auraGrad.addColorStop(1, 'rgba(0,0,0,0)');
            } else {
                auraGrad.addColorStop(0, 'rgba(255, 0, 50, 0.6)');
                auraGrad.addColorStop(0.5, 'rgba(100, 0, 0, 0.2)');
                auraGrad.addColorStop(1, 'rgba(0,0,0,0)');
            }
            ctx.fillStyle = auraGrad;
            ctx.beginPath(); ctx.arc(cx, cy, size * 1.5, 0, Math.PI * 2); ctx.fill();

            // Hair spikes
            ctx.fillStyle = color;
            ctx.beginPath();
            let spikeCount = 5;
            for(let i = 0; i <= spikeCount; i++) {
                let angle = Math.PI + (i * (Math.PI / spikeCount));
                let waveOffset = Math.sin(animVal * 0.1 + i) * 3;
                let hx = cx + Math.cos(angle) * (size * 0.6);
                let hy = cy + Math.sin(angle) * (size * 0.6) - (size * 0.4);
                let px = cx + Math.cos(angle + (Math.PI/10)) * (size * 0.9);
                let py = cy + Math.sin(angle + (Math.PI/10)) * (size * 0.9) - (size * 0.8) + waveOffset;
                if(i === 0) ctx.moveTo(hx, hy);
                ctx.lineTo(px, py);
                ctx.lineTo(hx, hy);
            }
            ctx.fill();

            // Head Core
            ctx.fillStyle = "#111122"; ctx.strokeStyle = color; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(cx, cy, size * 0.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

            // Eyes
            ctx.fillStyle = eyeColor; ctx.shadowBlur = 10; ctx.shadowColor = eyeColor;
            ctx.beginPath();
