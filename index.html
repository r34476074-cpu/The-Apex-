<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Apex Arena</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #03030d; 
            color: white; 
            font-family: sans-serif; 
            user-select: none;
        }
        #canvas { 
            display: block; 
            background: #040412; 
            outline: none;
        }
        .hud { 
            position: absolute; 
            pointer-events: none; 
            font-weight: bold; 
        }
        #stats { 
            top: 20px; 
            left: 20px; 
            font-size: 22px; 
            display: flex; 
            gap: 30px; 
            background: rgba(5, 5, 20, 0.9); 
            padding: 14px 24px; 
            border-radius: 10px; 
            border: 2px solid #00ffcc;
        }
        #upgrade-menu {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(6, 6, 22, 0.98);
            border: 3px solid #ffcc00;
            border-radius: 16px;
            padding: 30px;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            z-index: 100;
        }
        .upgrade-card {
            background: #111133;
            border: 2px solid #00ffcc;
            color: white;
            padding: 15px 40px;
            border-radius: 8px;
            cursor: pointer;
            width: 240px;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
        }
        .upgrade-card:hover { background: #00ffcc; color: black; }
    </style>
</head>
<body>

    <div id="upgrade-menu">
        <h2 style="color: #ffcc00; margin: 0;">LEVEL UP!</h2>
        <p style="color: #aaa; margin: 0 0 10px 0;">Select your Tank-Style trait upgrade:</p>
        <div class="upgrade-card" onclick="applyUpgrade('hp')">❤️ Hull Core (+25 Max HP)</div>
        <div class="upgrade-card" onclick="applyUpgrade('speed')">⚡ Thrusters (+1.5 Speed)</div>
        <div class="upgrade-card" onclick="applyUpgrade('size')">💥 Blast Radius (+5 Size)</div>
    </div>

    <canvas id="canvas" tabindex="0"></canvas>

    <div id="stats" class="hud">
        <div style="color: #ff3333;">HP: <span id="txt-hp">100</span>/<span id="txt-maxhp">100</span></div>
        <div style="color: #ffcc00;">Level: <span id="txt-lv">1</span></div>
        <div style="color: #00ffcc;">Coins: <span id="txt-coins">0</span></div>
    </div>   <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        function resize() { 
            canvas.width = window.innerWidth; 
            canvas.height = window.innerHeight; 
        }
        window.addEventListener('resize', resize);
        resize();

        let isUpgrading = false;
        let stats = { level: 1, coins: 0, kills: 0 };
        let player = { 
            x: 2000, y: 2000, speed: 6, 
            color: '#00ffcc', shadeColor: '#00aa88',
            hp: 100, maxHp: 100, invuln: 0, anim: 0
        };
        let blastSize = 10;
        let keys = {};
        let mouse = { x: 0, y: 0 };
        let projectiles = [];
        let enemies = [];

        canvas.addEventListener('keydown', (e) => { 
            keys[e.key.toLowerCase()] = true; 
            if(['w','a','s','d','arrowup','arrowdown'].includes(e.key.toLowerCase())) e.preventDefault();
        });
        canvas.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });
        window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });

        canvas.addEventListener('mousedown', (e) => {
            if(isUpgrading || player.hp <= 0 || e.target.closest('#upgrade-menu')) return;
            let angle = Math.atan2(mouse.y - canvas.height/2, mouse.x - canvas.width/2);
            projectiles.push({ x: player.x, y: player.y, vx: Math.cos(angle)*15, vy: Math.sin(angle)*15, life: 60, size: blastSize });
        });

        function applyUpgrade(choice) {
            if(choice === 'hp') { player.maxHp += 25; player.hp = player.maxHp; }
            if(choice === 'speed') { player.speed += 1.5; }
            if(choice === 'size') { blastSize += 5; }
            isUpgrading = false;
            document.getElementById('upgrade-menu').style.display = 'none';
            canvas.focus();
            updateHUD();
        }

        function spawnEnemy() {
            let mult = 1 + (stats.level * 0.15);
            let angle = Math.random() * Math.PI * 2;
            let dist = 600 + Math.random() * 200;
            enemies.push({ x: player.x + Math.cos(angle)*dist, y: player.y + Math.sin(angle)*dist, hp: 20*mult, speed: 1.8 + (stats.level*0.2), size: 26*mult });
        }
        for(let i=0; i<6; i++) spawnEnemy();

        function updateHUD() {
            document.getElementById('txt-hp').innerText = player.hp;
            document.getElementById('txt-maxhp').innerText = player.maxHp;
            document.getElementById('txt-lv').innerText = stats.level;
            document.getElementById('txt-coins').innerText = stats.coins;
        }

        function drawDetailCharacter(x, y, size, mainColor, accentColor, isBot, frame) {
            ctx.save();
            let glow = ctx.createRadialGradient(x, y, size*0.2, x, y, size*1.3);
            glow.addColorStop(0, mainColor); glow.addColorStop(0.5, accentColor + '33'); glow.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(x, y, size*1.3, 0, Math.PI*2); ctx.fill();

            ctx.fillStyle = mainColor; ctx.beginPath();
            for(let i=0; i<=6; i++) {
                let a = Math.PI + (i * (Math.PI / 6));
                let wave = Math.sin(frame * 0.15 + i) * 4;
                ctx.lineTo(x + Math.cos(a + 0.2)*(size*0.9), y + Math.sin(a + 0.2)*(size*0.9) - 15 + wave);
            }
            ctx.fill();

            ctx.fillStyle = '#0f0f26'; ctx.strokeStyle = mainColor; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.arc(x, y, size*0.5, 0, Math.PI*2); ctx.fill(); ctx.stroke();

            ctx.fillStyle = '#ffffff'; ctx.shadowBlur = 10; ctx.shadowColor = mainColor;
            ctx.fillRect(x - size*0.22, y - 3, 5, 5); ctx.fillRect(x + size*0.12, y - 3, 5, 5);
            ctx.restore();
        }

        function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if(player.hp <= 0) {
                ctx.fillStyle = "rgba(20, 0, 0, 0.8)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "white"; ctx.font = "bold 40px sans-serif"; ctx.textAlign = "center";
                ctx.fillText("GAME OVER", canvas.width/2, canvas.height/2); return;
            }
            if(isUpgrading) { requestAnimationFrame(loop); return; }
            player.anim++;

            if(keys['w'] || keys['arrowup']) player.y -= player.speed;
            if(keys['s'] || keys['arrowdown']) player.y += player.speed;
            if(keys['a'] || keys['arrowleft']) player.x -= player.speed;
            if(keys['d'] || keys['arrowright']) player.x += player.speed;

            let camX = canvas.width / 2 - player.x;
            let camY = canvas.height / 2 - player.y;
            if(player.invuln > 0) player.invuln--;

            ctx.strokeStyle = '#14143a'; ctx.lineWidth = 2;
            for(let i=0; i<4000; i+=120) {
                ctx.beginPath(); ctx.moveTo(i + camX, camY); ctx.lineTo(i + camX, 4000 + camY); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(camX, i + camY); ctx.lineTo(4000 + camX, i + camY); ctx.stroke();
            }

            for(let i = projectiles.length - 1; i >= 0; i--) {
                let p = projectiles[i]; p.x += p.vx; p.y += p.vy; p.life--;
                ctx.fillStyle = player.color; ctx.beginPath(); ctx.arc(p.x + camX, p.y + camY, p.size, 0, Math.PI*2); ctx.fill();

                for(let j = enemies.length - 1; j >= 0; j--) {
                    let e = enemies[j];
                    if(Math.hypot(p.x - e.x, p.y - e.y) < e.size*0.6) {
                        e.hp -= 10; p.life = 0;
                        if(e.hp <= 0) {
                            enemies.splice(j, 1); stats.kills++; stats.coins += 5;
                            if(stats.kills % 3 === 0) { stats.level++; isUpgrading = true; document.getElementById('upgrade-menu').style.display = 'flex'; }
                            updateHUD(); spawnEnemy();
                        }
                    }
                }
                if(p.life <= 0) projectiles.splice(i, 1);
            }

            enemies.forEach(e => {
                let angle = Math.atan2(player.y - e.y, player.x - e.x);
                e.x += Math.cos(angle) * e.speed; e.y += Math.sin(angle) * e.speed;
                drawDetailCharacter(e.x + camX, e.y + camY, e.size, '#ff3355', '#990022', true, player.anim);
                if(Math.hypot(player.x - e.x, player.y - e.y) < (e.size*0.5 + 16) && player.invuln === 0) { player.hp -= 15; player.invuln = 30; updateHUD(); }
            });

            if(player.invuln > 20) { ctx.fillStyle = "rgba(255, 0, 0, 0.25)"; ctx.fillRect(0, 0, canvas.width, canvas.height); }
            drawDetailCharacter(canvas.width / 2, canvas.height / 2, 34, player.color, player.shadeColor, false, player.anim);
            requestAnimationFrame(loop);
        }
        canvas.focus();
        loop();
    </script>
</body>
</html>
